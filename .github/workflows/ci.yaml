name: CI

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+-?**'
  pull_request: {}

jobs:
  build-cli:
    name: Build CLI
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on windows
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            ext: .exe
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/static-config${{ matrix.ext }} lib/static-config-${{ matrix.target }}${{ matrix.ext }}
      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: static-config-${{ matrix.target }}
          path: lib/static-config-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 7
      - name: Install wasmtime
        run: cargo binstall --force wasmtime-cli
      - name: Smoke test CLI
        run: |
          echo "name=componentized" | lib/static-config-${{ matrix.target }}${{ matrix.ext }} -p greeting=hello -f - -o smoke.wasm
          expect() {
            local actual=$(wasmtime run --invoke "get(\"${1}\")" smoke.wasm)
            if [ "${actual}" != "${2}" ]; then
              echo "get(\"${1}\") expected: ${2}"
              echo "get(\"${1}\") actual:   ${actual}"
              exit 1
            fi
          }
          expect greeting 'ok(some("hello"))'
          expect name 'ok(some("componentized"))'
          expect missing 'ok(none)'

  build-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install wasm-tools
        run: cargo binstall --force wasm-tools
      - name: Install wkg
        run: cargo binstall --force wkg
      - name: Build
        run: ./build.sh
      - name: Collect components.tar
        run: tar -cvf ../components.tar *
        working-directory: ./lib
      - name: Upload components.tar
        uses: actions/upload-artifact@v7
        with:
          name: components.tar
          path: components.tar
          retention-days: 7
      - name: Disallow generated drift
        run: git diff --exit-code .

  # synthetic job used to gate merging PRs
  test:
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - build-components
    steps:
      - name: Nothing to do
        run: true

  publish:
    if: github.event_name == 'push' && ( startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' )
    needs:
      - test
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install wkg
        run: cargo binstall --force wkg
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
      - name: Download components.tar
        uses: actions/download-artifact@v8
        with:
          name: components.tar
      - name: Extract components
        run: tar -xvf components.tar -C lib
      - name: Download CLIs
        uses: actions/download-artifact@v8
        with:
          pattern: static-config-*
          path: ./lib/
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish factory to gchr.io
        run: ./publish.sh "ghcr.io/${{ github.repository }}" "${{ steps.get_version.outputs.VERSION }}"
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            lib/factory.wasm
            lib/static-config-*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

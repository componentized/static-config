[package]
name = "static-config"
version = "0.2.0"
edition = "2021"

license = "Apache-2.0"
repository = "https://github.com/componentized/static-config"
description = "Create custom wasi:config components with static values"
default-run = "static-config"
include = [
    "/lib/config.wasm",
    "/src",
    "README.md",
    "NOTICE",
    "LICENSE"
]

[profile.release]
panic = 'abort'

# release builds of the factory component, optimized for size rather than speed as it is published
# and downloaded. The cli is built with the release profile.
[profile.component]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "static-config"
path = "src/bin/main.rs"
doc = false

[workspace]
members = [
    "factory",
]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
componentized-constants = "0.1.1"
java-properties = "2.0"
wasm-encoder = "0.261.0"
wasm-metadata = "0.261.0"
wasmparser = "0.261.0"
wit-component = "0.261.0"
wit-parser = "0.261.0"

[dev-dependencies]
wasmtime = "48"

[workspace.dependencies]
anyhow = "1"
static-config = { path = "." }
wit-bindgen = "0.62"
